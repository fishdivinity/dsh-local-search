# dsh-local-search bundle patch: installs the local-search plugin row.
# Every key has a schema default; override any of them here by replacing this
# row's config (the whole row is replaced, never deep-merged).
# Keep this file neutral (config: {}) in the package: machine-specific paths
# such as esPath / workRoot belong in the user's profile patch, not here.
- insert:
    - id: fishdivinity-local-search
      name: '@fishdivinity/dsh-local-search'
      config: {}
