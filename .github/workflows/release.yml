name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match package version v$version"
            exit 1
          }

      - name: Verify release notes exist
        shell: bash
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -f "$notes" || {
            echo "missing $notes; start from docs/releases/TEMPLATE.md"
            exit 1
          }

      - name: Expand relative links for the release body
        shell: bash
        run: |
          # A Release page has no file path for `../../` to resolve against, so the
          # published body gets absolute URLs while the repository copy keeps the
          # relative links that work on a blob page.
          node scripts/expand-release-links.mjs \
            "docs/releases/$GITHUB_REF_NAME.md" \
            "$RUNNER_TEMP/release-notes.md"

      - run: npm test
      - run: npm run check

      - name: Check whether this version is already published
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@fishdivinity/dsh-local-search@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (trusted publishing)
        if: steps.version.outputs.published != 'true'
        run: npm publish --access public --provenance

      - name: Create or update GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if ! gh release edit "$GITHUB_REF_NAME" --draft=false --notes-file "$body" --title "$GITHUB_REF_NAME"; then
              gh release delete "$GITHUB_REF_NAME" --yes
              gh release create "$GITHUB_REF_NAME" --draft=false --notes-file "$body" --title "$GITHUB_REF_NAME"
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft=false --notes-file "$body" --title "$GITHUB_REF_NAME"
          fi
